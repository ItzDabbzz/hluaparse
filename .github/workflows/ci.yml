name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - run: npm ci
      - run: make lint complexity-analysis
    strategy:
      fail-fast: false
      matrix:
        # The lint and complexity tools are only checked on the two ends of
        # the supported range; one run is enough to catch a syntax regression.
        version: [20.x, 24.x]

  run-tests-node:
    name: Test in Node.js (ES6 source)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js ${{ matrix.version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - run: node test/runner.js | .github/tap_check.bash

  run-tests-bun:
    name: Test in Bun (ES6 source)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.3.13', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}
      - run: bun test/runner.js | .github/tap_check.bash

  run-tests-rhino:
    name: Test in Rhino (ES5 build)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.7.15 is the newest release that ships a standalone shell jar on
        # GitHub. 1.8+ moved to Maven Central, where the shell lives in the
        # separate `rhino-tools` artifact, so it needs the classpath form.
        include:
          - version: '1.7.15'
            source: github
          - version: '1.9.1'
            source: maven
    steps:
      - uses: actions/checkout@v4
      - name: Build the ES5 artifact
        run: npm ci && node scripts/build-es5
      - name: Download Rhino ${{ matrix.version }} from ${{ matrix.source }}
        run: |
          VERSION="${{ matrix.version }}"
          if [ "${{ matrix.source }}" = "github" ]; then
            wget "https://github.com/mozilla/rhino/releases/download/Rhino${VERSION//./_}_Release/rhino-$VERSION.jar" -O /opt/rhino.jar
          else
            wget "https://repo1.maven.org/maven2/org/mozilla/rhino/$VERSION/rhino-$VERSION.jar" -O /opt/rhino.jar
            wget "https://repo1.maven.org/maven2/org/mozilla/rhino-tools/$VERSION/rhino-tools-$VERSION.jar" -O /opt/rhino-tools.jar
          fi
      - name: Run tests
        run: |
          cd test
          export LUAPARSE_ENTRY=../dist/luaparse.es5
          if [ "${{ matrix.source }}" = "maven" ]; then
            # ":" is the classpath separator on the Linux runner; ";" is
            # Windows-only and silently resolves to a single bogus path here.
            java -cp "/opt/rhino.jar:/opt/rhino-tools.jar" \
              org.mozilla.javascript.tools.shell.Main -opt -1 runner.js | ../.github/tap_check.bash
          else
            java -jar /opt/rhino.jar -opt -1 runner.js | ../.github/tap_check.bash
          fi

  run-tests-ringojs:
    name: Test in RingoJS (ES5 build)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['4.0.0']
    steps:
      - uses: actions/checkout@v4
      - name: Build the ES5 artifact
        run: npm ci && node scripts/build-es5
      - name: Download and unpack RingoJS ${{ matrix.version }}
        run: |
          VERSION="${{ matrix.version }}"
          wget "https://github.com/ringo/ringojs/releases/download/v${VERSION}/ringojs-${VERSION}.zip"
          unzip "ringojs-${VERSION}.zip" -d /opt/
          rm "ringojs-${VERSION}.zip"
      - name: Install RingoJS ${{ matrix.version }}
        run: |
          VERSION="${{ matrix.version }}"
          sed -i -e '/-jar/ i \    -Dringo.classpath="$RINGO_HOME/lib/**" \\' "/opt/ringojs-${VERSION}/bin/ringo"
          sudo ln -s "/opt/ringojs-${VERSION}/bin/ringo" /usr/local/bin/ringo
          sudo chmod +x /usr/local/bin/ringo
      - name: Run tests
        # runner.js is executed from the repo root, so the ES5 entry is
        # dist/luaparse.es5 (paths are resolved relative to test/, where the
        # runner lives, hence the ../ on the other engines).
        run: LUAPARSE_ENTRY=../dist/luaparse.es5 ringo -o -1 test/runner.js 2>&1 | .github/tap_check.bash

  run-tests-quickjs:
    name: Test in QuickJS (ES5 build)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['2020-09-06', '2025-04-26', '2025-09-13', '2026-06-04']

    steps:
      - uses: actions/checkout@v4
      - name: Build the ES5 artifact
        run: npm ci && node scripts/build-es5
      - name: Install QuickJS ${{ matrix.version }}
        run: |
          wget "https://bellard.org/quickjs/binary_releases/quickjs-linux-x86_64-${{ matrix.version }}.zip" -O quickjs.zip
          unzip quickjs.zip qjs
          sudo install -Dm755 qjs /usr/local/bin/qjs
      - name: Run tests
        # XXX: The default QuickJS stack size limit is 256 KiB;
        # QuickJS likes to throw stack overflow errors when running the test suite at that limit,
        # so we increase it to 8 MiB. The issue is intermittent and non-deterministic;
        # it may or may not be an engine bug
        run: cd test; LUAPARSE_ENTRY=../dist/luaparse.es5 qjs --stack-size 8388608 --std runner.js | ../.github/tap_check.bash

  run-tests-duktape:
    name: Test in Duktape (ES5 build)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [2.4.0, 2.5.0, 2.6.0, 2.7.0]
    steps:
      - uses: actions/checkout@v4
      - name: Build the ES5 artifact
        run: npm ci && node scripts/build-es5
      - name: Build and install Duktape ${{ matrix.version }}
        run: |
          PACKAGE="duktape-${{ matrix.version }}"
          cd /opt
          wget "https://duktape.org/$PACKAGE.tar.xz"
          tar xf "$PACKAGE.tar.xz"
          make -C "$PACKAGE/" -f Makefile.cmdline DEFINES=-DDUK_CMDLINE_FILEIO
          sudo install -Dm755 "$PACKAGE/duk" /usr/local/bin/duk
          rm -rf "$PACKAGE.tar.xz" "$PACKAGE/"
      - name: Run tests
        run: cd test; LUAPARSE_ENTRY=../dist/luaparse.es5 duk runner.js | ../.github/tap_check.bash

  check-coverage:
    name: Coverage analysis
    needs: [run-tests-node, run-tests-bun, run-tests-rhino, run-tests-ringojs, run-tests-quickjs, run-tests-duktape]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: make coverage-analysis

  update-docs:
    name: Update documentation
    if: ${{ github.event_name == 'push' && github.event.ref == 'refs/heads/master' }}
    needs: check-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: refs/heads/gh-pages
          path: .
      - name: Check out luaparse
        uses: actions/checkout@v4
        with:
          path: luaparse
      - name: Rebuild documentation
        run: |
          rm -rf coverage examples lib benchmarks
          sed -i -e 's/\.\.\///g' luaparse/docs/layout/head.html luaparse/docs/*.md
          make -C luaparse install docs
          mv luaparse/docs/* .
          mv luaparse/examples .
          mv luaparse/luaparse.js .
          mv luaparse/benchmarks .
          cp -rf luaparse/test .
          rm -rf *.md layout luaparse public
      - name: Upload updated documentation to GitHub Pages
        run: |
          git add .
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git commit --message "Rebuild documentation"
          git push origin gh-pages
