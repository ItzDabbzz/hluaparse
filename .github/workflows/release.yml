name: Release

# Publishing is npm-only. This workflow never creates or modifies a GitHub
# Release and never uploads release assets.
# Driven by the tag, not by a GitHub Release: creating a Release to trigger
# the publish would mean GitHub publishing, which is not wanted here.
# Publishing a v* tag is what puts the package on npm.
on:
  push:
    tags:
      - 'v*'

# id-token is required for npm provenance attestation.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # NPM_TOKEN lives in the Deploy environment, not at repo level, so the job
    # has to declare it or secrets.NPM_TOKEN resolves to empty and npm fails
    # with ENEEDAUTH.
    environment: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      # Staged publishing needs npm >= 11.15.0 and Node >= 22.14.0. Node 24
      # satisfies the Node half, but the npm that ships with it is not
      # guaranteed to be new enough, so the floor is asserted rather than
      # assumed.
      - name: Verify the toolchain supports staged publishing
        run: |
          # process.versions.npm does not exist, so the version has to come
          # from npm itself.
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e '
            const [maj, min] = process.argv[1].split(".").map(Number);
            if (maj < 11 || (maj === 11 && min < 15)) {
              console.error("npm " + process.argv[1] +
                " is too old; staged publishing needs 11.15.0 or later");
              process.exit(1);
            }
            console.log("npm " + process.argv[1] + " supports staged publishing");
          ' "$NPM_VERSION"

      # The version in package.json must match the git tag, otherwise the
      # release publishes a number that does not correspond to the tag.
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json is $PKG_VERSION but the release tag is $TAG_VERSION"
            exit 1
          fi
          echo "publishing $PKG_VERSION"

      - run: npm ci
      # Mirrors the CI gates so a release can never ship past a red one.
      - run: make lint complexity-analysis
      - run: node test/runner.js | .github/tap_check.bash

      # dist/ is gitignored, so a clean checkout has no ES5 build. It is
      # listed in package.json "files", so it must be generated here or the
      # published tarball advertises a path that is not in it.
      - name: Build the ES5 artifact
        run: node scripts/build-es5

      - name: Verify the packed tarball
        run: |
          # npm pack does not create --pack-destination for you.
          mkdir -p staging
          npm pack --pack-destination staging
          tar -tzf staging/*.tgz | grep -q 'dist/luaparse.es5.js' \
            || { echo "dist/luaparse.es5.js missing from the tarball"; exit 1; }
          echo "tarball contains the ES5 build"

      # The npm token is a stage-only token, so it cannot publish a version
      # directly; npm rejects that with a 403. Staging puts the tarball in a
      # non-public state and a maintainer promotes it with 2FA via
      # `npm stage approve`. Everything is gated and the tarball verified
      # before this point, so what gets staged is the tested artifact.
      - name: Stage the version for review
        # The ./ prefix is required: without it npm reads the bare filename
        # as a git spec and tries to clone it over ssh.
        run: npm stage publish ./staging/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report what is waiting for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm stage list || true
          {
            echo
            echo "Staged \`$PKG@$VER\`, not yet public."
            echo "A maintainer promotes it with 2FA:"
            echo "  npm stage list"
            echo "  npm stage approve <stage-id>"
            echo "Until then \`npm install $PKG\` will not resolve $VER."
          } >> "$GITHUB_STEP_SUMMARY"
