name: Release

# Publishing is npm-only. This workflow never creates or modifies a GitHub
# Release and never uploads release assets.
# Driven by the tag, not by a GitHub Release: creating a Release to trigger
# the publish would mean GitHub publishing, which is not wanted here.
# Publishing a v* tag is what puts the package on npm.
on:
  push:
    tags:
      - 'v*'

# id-token is required for npm provenance attestation.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          # Trusted publishing: npm exchanges this workflow's OIDC identity
          # for a short-lived token, so no NPM_TOKEN secret is involved.
          id-token: write

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 24
      # satisfies the Node half, but the npm that ships with it is not
      # guaranteed to be new enough, so the floor is asserted rather than
      # assumed.
      - name: Verify the toolchain supports trusted publishing
        run: |
          # process.versions.npm does not exist, so the version has to come
          # from npm itself.
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e '
            const [maj, min] = process.argv[1].split(".").map(Number);
            if (maj < 11 || (maj === 11 && min < 5)) {
              console.error("npm " + process.argv[1] +
                " is too old; trusted publishing needs 11.5.1 or later");
              process.exit(1);
            }
            console.log("npm " + process.argv[1] + " supports trusted publishing");
          ' "$NPM_VERSION"

      # The version in package.json must match the git tag, otherwise the
      # release publishes a number that does not correspond to the tag.
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json is $PKG_VERSION but the release tag is $TAG_VERSION"
            exit 1
          fi
          echo "publishing $PKG_VERSION"

      - run: npm ci
      # Mirrors the CI gates so a release can never ship past a red one.
      - run: make lint complexity-analysis
      - run: node test/runner.js | .github/tap_check.bash

      # dist/ is gitignored, so a clean checkout has no ES5 build. It is
      # listed in package.json "files", so it must be generated here or the
      # published tarball advertises a path that is not in it.
      - name: Build the ES5 artifact
        run: node scripts/build-es5

      - name: Verify the packed tarball
        run: |
          # npm pack does not create --pack-destination for you.
          mkdir -p staging
          npm pack --pack-destination staging
          tar -tzf staging/*.tgz | grep -q 'dist/luaparse.es5.js' \
            || { echo "dist/luaparse.es5.js missing from the tarball"; exit 1; }
          echo "tarball contains the ES5 build"

      # Trusted publishing: the only credential is this job's OIDC identity,
      # which npm exchanges for a short-lived token. Nothing long-lived is
      # stored in the repository, so there is no secret to leak or rotate.
      # The tarball built above is what ships, so what is published is the
      # exact artifact the gates were run against.
      - name: Publish to npm
        run: npm publish ./staging/*.tgz --access public

      - name: Confirm it landed
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          {
            echo "Published \`$PKG@$VER\` to npm via trusted publishing."
            echo "Install: \`npm install $PKG\`"
          } >> "$GITHUB_STEP_SUMMARY"
