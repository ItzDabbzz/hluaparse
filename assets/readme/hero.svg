<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">hluaparse — a Lua parser for JavaScript</title>
  <desc id="heroDesc">hluaparse parses Lua 5.1 through 5.5 plus the FiveM dialect, with 3,197 assertions, 100 percent coverage, and 15 engine configurations tested in CI. The diagram shows the AST it returns for the source local x = 1 plus 2.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .pri  { fill: #E6EAF2; }
      .mut  { fill: #7C8697; }
      .acc  { fill: #5EE6A8; }
      .sec  { fill: #F0A868; }
      .node { fill: #141A24; stroke: #2A3444; stroke-width: 1.5; }
      .wire { fill: none; stroke: #2A3444; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="26" fill="none" stroke="#1A2130" stroke-width="1"/>

  <!-- ================= left: identity and proof ================= -->
  <g transform="translate(56,52)">
    <text class="sans mut" x="0" y="0" font-size="17" letter-spacing="1.4">LUA PARSER FOR JAVASCRIPT</text>

    <text class="sans pri" x="0" y="62" font-size="56" font-weight="700" letter-spacing="-1.4">hluaparse</text>

    <text class="sans pri" x="0" y="102" font-size="21">Lua 5.1 to 5.5, plus the FiveM dialect.</text>
    <text class="sans mut" x="0" y="130" font-size="21">One parser, every runtime you ship to.</text>

    <!-- Figures above short labels on a single hairline rule. A pill per
         number read as competing dashboard tiles; one rule keeps it a
         caption and puts every figure on one baseline. -->
    <g transform="translate(0,164)">
      <path d="M 0 0 L 480 0" stroke="#1E2635" stroke-width="1.5"/>

      <text class="mono acc" x="0" y="32" font-size="24" font-weight="600">3,197</text>
      <text class="sans mut" x="0" y="56" font-size="15">assertions</text>

      <text class="mono acc" x="132" y="32" font-size="24" font-weight="600">100%</text>
      <text class="sans mut" x="132" y="56" font-size="15">coverage</text>

      <text class="mono acc" x="256" y="32" font-size="24" font-weight="600">5.1&#8211;5.5</text>
      <text class="sans mut" x="256" y="56" font-size="15">Lua versions</text>

      <text class="mono acc" x="404" y="32" font-size="24" font-weight="600">15</text>
      <text class="sans mut" x="404" y="56" font-size="15">engines tested</text>
    </g>

    <text class="sans mut" x="0" y="288" font-size="15">MIT licensed &#183; no runtime dependencies</text>
  </g>

  <!-- ================= right: the AST it produces ================= -->
  <g transform="translate(672,34)">
    <path d="M 0 22 L 472 22" stroke="#1A2130" stroke-width="1.5"/>
    <text class="mono mut" x="0" y="12" font-size="15" letter-spacing="0.4">AST for  local x = 1 + 2</text>

    <rect class="node" x="0" y="44" width="86" height="40" rx="12"/>
    <text class="mono pri" x="16" y="70" font-size="19">Chunk</text>

    <path class="wire" d="M 26 84 L 26 98 L 24 98 L 24 112"/>
    <rect class="node" x="0" y="112" width="178" height="40" rx="12"/>
    <text class="mono pri" x="16" y="138" font-size="19">LocalStatement</text>

    <path class="wire" d="M 70 152 L 70 174 L 68 174 L 68 188"/>
    <path class="wire" d="M 70 174 L 320 174 L 320 188"/>

    <rect class="node" x="0" y="188" width="137" height="64" rx="12"/>
    <text class="mono pri" x="16" y="214" font-size="19">Identifier</text>
    <text class="mono mut" x="16" y="238" font-size="17">name</text>
    <text class="mono acc" x="70" y="238" font-size="17">x</text>

    <rect class="node" x="170" y="188" width="300" height="64" rx="12"/>
    <text class="mono pri" x="186" y="214" font-size="19">BinaryExpression</text>
    <text class="mono mut" x="186" y="238" font-size="17">operator</text>
    <text class="mono sec" x="284" y="238" font-size="17">+</text>

    <path class="wire" d="M 320 252 L 320 262"/>
    <path class="wire" d="M 222 262 L 385 262"/>
    <path class="wire" d="M 222 262 L 222 272"/>
    <path class="wire" d="M 385 262 L 385 272"/>

    <rect class="node" x="139" y="272" width="166" height="64" rx="12"/>
    <text class="mono mut" x="156" y="298" font-size="17">NumericLiteral</text>
    <text class="mono mut" x="156" y="322" font-size="17">value</text>
    <text class="mono acc" x="215" y="322" font-size="17">1</text>

    <rect class="node" x="318" y="272" width="166" height="64" rx="12"/>
    <text class="mono mut" x="335" y="298" font-size="17">NumericLiteral</text>
    <text class="mono mut" x="335" y="322" font-size="17">value</text>
    <text class="mono acc" x="394" y="322" font-size="17">2</text>
  </g>
</svg>
